{{- if .Values.vaultSecret.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "sample-service.name" . }}-vault
  labels:
    {{- include "sample-service.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "vaultSecret.clientId must be set when vaultSecret.enabled is true" .Values.vaultSecret.clientId | quote }}
    keyvaultName: {{ required "vaultSecret.vaultName must be set when vaultSecret.enabled is true" .Values.vaultSecret.vaultName | quote }}
    tenantId: {{ required "vaultSecret.tenantId must be set when vaultSecret.enabled is true" .Values.vaultSecret.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ required "vaultSecret.objectName must be set when vaultSecret.enabled is true" .Values.vaultSecret.objectName }}
          objectType: secret
{{- end }}
