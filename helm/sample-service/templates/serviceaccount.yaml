apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sample-service.name" . }}
  {{- if .Values.vaultSecret.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ required "vaultSecret.clientId must be set when vaultSecret.enabled is true" .Values.vaultSecret.clientId | quote }}
  {{- end }}
  labels:
    {{- include "sample-service.labels" . | nindent 4 }}
automountServiceAccountToken: false
