# Values of the sample service in `dev`. The image tag is the commit SHA of the
# build. A pull request opened by a workflow changes it (ADR 0018). Until the
# first image is published the tag is a placeholder, and the pods cannot pull.
image:
  repository: ghcr.io/franklindot04/sample-service
  tag: e2d19a23230af675e46bc971851470e51dd5cdca

ingress:
  enabled: true
  className: nginx.approuting.kubernetes.azure.com
