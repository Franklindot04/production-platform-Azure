# Values of the sample service in `dev`. The image tag is the commit SHA of the
# build. The tag workflow sets it through a pull request
# (.github/workflows/image-tag-bump.yml, ADR 0018).
image:
  repository: ghcr.io/franklindot04/sample-service
  tag: 43247ebb83a06162a08ed1d9cb729718218bc886

ingress:
  enabled: true
  className: nginx.approuting.kubernetes.azure.com

# Traces go to the Collector in the observability namespace (ADR 0026). The Go
# exporter appends /v1/traces.
tracing:
  enabled: true
  endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4318
