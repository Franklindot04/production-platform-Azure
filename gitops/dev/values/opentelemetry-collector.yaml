# Values of the OpenTelemetry Collector chart in `dev` (ADR 0025).
# The value names were written from the documented values of chart
# opentelemetry-collector 0.178.2.
# The connection string is not in this file. It comes from the cluster secret
# appinsights-connection, which session.sh creates at run time.

mode: deployment
replicaCount: 1

image:
  # The chart's own appVersion is 0.163.2. The contrib distribution is used
  # because the Azure Monitor exporter is only in it.
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: "0.165.0"

command:
  name: otelcol-contrib

extraEnvs:
  - name: APPLICATIONINSIGHTS_CONNECTION_STRING
    valueFrom:
      secretKeyRef:
        name: appinsights-connection
        key: connection-string

# These keys are documented as presets that add receivers,
# processors or RBAC. All are off.
presets:
  logsCollection:
    enabled: false
  hostMetrics:
    enabled: false
  kubeletMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: false
  kubernetesEvents:
    enabled: false
  clusterMetrics:
    enabled: false

# The chart enables the Jaeger, Zipkin and Prometheus-style ports
# by default. Only the OTLP ports are used.
ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false

# ClusterIP, with only the OTLP ports from `ports` above.
service:
  type: ClusterIP

# A null value removes the chart's default entry from the merged
# configuration.
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger: null
    prometheus: null
    zipkin: null
  processors:
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
  exporters:
    debug: null
    azure_monitor:
      connection_string: "${env:APPLICATIONINSIGHTS_CONNECTION_STRING}"
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [azure_monitor]
      metrics: null
      logs: null

# Initial values. They are not measured.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
