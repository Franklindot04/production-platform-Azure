name: Task
description: A single piece of planned work
labels: ["task"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent epic
      description: Issue number of the epic this task belongs to.
      placeholder: "#1"
    validations:
      required: true
  - type: input
    id: jira
    attributes:
      label: Jira key
      description: Optional. Roadmap key if one exists.
      placeholder: PP-
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checkbox list. Each item can be checked by looking at something.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
