# Scans the repository and the sample service image with Trivy (ADR 0020).
#
# The config job looks for misconfiguration in the Terraform, the Kubernetes manifests and the chart,
# and for secrets in the files. The image job builds the sample service image and looks for
# vulnerabilities and secrets in it. A finding of severity HIGH or CRITICAL fails the run.
#
# An accepted finding is added to .trivyignore.yaml with a reason.
#
# The action is pinned by full SHA and Trivy is pinned to v0.69.3. Do not change either without
# checking the advisory for the new version.
name: Security scans

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - "kubernetes/**"
      - "helm/**"
      - "gitops/**"
      - "applications/**"
      - ".trivyignore.yaml"
      - ".github/workflows/security-scans.yml"

permissions:
  contents: read

jobs:
  config:
    name: Misconfiguration and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The chart needs image.tag to render, so the dev values are passed in.
      - name: Scan for misconfiguration
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
          TRIVY_HELM_VALUES: gitops/dev/values/sample-service.yaml
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          version: v0.69.3

      - name: Scan the files for secrets
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: fs
          scanners: secret
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.69.3

  image:
    name: Image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t sample-service:scan applications/sample-service

      - name: Scan the image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          image-ref: sample-service:scan
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.69.3
