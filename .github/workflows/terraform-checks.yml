name: Terraform checks

on:
  pull_request:
    paths:
      - "infrastructure/**"

permissions:
  contents: read

jobs:
  fmt-validate:
    name: Format and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure

      - name: Validate every root
        run: |
          set -euo pipefail
          roots=$(find infrastructure -name versions.tf -exec dirname {} \; | sort)
          if [ -z "$roots" ]; then
            echo "No Terraform root found under infrastructure/" >&2
            exit 1
          fi
          for dir in $roots; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
