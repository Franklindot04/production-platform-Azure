name: Open pull request for the image tag

on:
  workflow_run:
    workflows:
      - Publish image
    types:
      - completed

permissions: {}

concurrency:
  group: image-tag-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Change the tag in gitops/dev
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set the tag
        id: set
        run: |
          result="$(.github/scripts/set-image-tag.sh gitops/dev/values/sample-service.yaml "$TAG")"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: ${{ steps.set.outputs.result == 'changed' }}
        run: .github/scripts/open-image-tag-pr.sh
