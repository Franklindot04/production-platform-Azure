# Findings that the security scans accept (.github/workflows/security-scans.yml).
#
# Each entry needs:
#   id:         the finding ID, for example a vulnerability or misconfiguration ID
#   paths:      the files the entry applies to
#   statement:  the reason the finding is accepted
# expired_at is optional. Entries are reviewed in pull requests.
misconfigurations:
  - id: AZU-0013
    paths:
      - infrastructure/environments/dev/persistent/keyvault.tf
    statement: "The vault uses Azure RBAC. The sample service identity has Key Vault Secrets User and the maintainer has Key Vault Secrets Officer (workload-identity.tf). A deny-by-default network rule would block Terraform runs from the maintainer's machine and the cluster's pods, and the address of the cluster's outbound traffic exists only during a session. The network rule is deferred (ADR 0029)."
vulnerabilities: []
secrets: []
