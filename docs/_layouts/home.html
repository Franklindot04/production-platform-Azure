---
layout: default
---
<section class="hero">

  <div class="start-row">
    {% for s in page.start %}<a class="start-link" data-stage="{{ s.stage }}" href="{{ s.url | relative_url }}">{{ s.title }}</a>{% endfor %}
  </div>
  {% endif %}
  <div class="hero-ring">
    <svg class="ring" viewBox="0 64 340 236" width="340" height="236" aria-hidden="true" focusable="false">
      <path class="ring-arc ring-build" d="M181.69 86.82A84 84 0 0 1 244.17 130.56"/><polygon class="ring-head ring-build" points="255.65,124.46 252.15,145.57 232.69,136.67"/><circle class="ring-dot ring-build" cx="218.18" cy="101.19" r="15"/><text class="ring-num" x="218.18" y="106.69" text-anchor="middle">1</text><text class="ring-label ring-build" x="231.95" y="86.03" text-anchor="start">build</text>

{{ content }}
