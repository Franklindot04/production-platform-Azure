title: production-platform-Azure
description: An Azure platform for running a service on AKS with Terraform, Argo CD, CI, observability and incident handling.
theme: jekyll-theme-minimal
plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-default-layout
relative_links:
  enabled: true
  collections: false
optional_front_matter:
  remove_originals: true
titles_from_headings:
  enabled: true
  strip_title: true
  collection: false
