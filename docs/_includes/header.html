<header class="site-header">
  <button type="button" class="btn menu-button" id="menu-button" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="menu-text">Menu</span>
  </button>
  <a class="brand" href="{{ '/' | relative_url }}">
    {% include logo.html size=24 %}
    <span class="brand-name">{{ site.title }}</span>
  </a>
  <button type="button" class="btn icon-btn search-toggle" id="search-toggle" aria-expanded="false" aria-controls="search-panel" aria-label="Search">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="search" id="search-panel" role="search">
    <label class="visually-hidden" for="search-input">Search the documentation</label>
    <svg class="search-glyph" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="search" id="search-input" placeholder="Search, press /" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" data-index="{{ '/assets/search.json' | relative_url }}">
    <ul class="search-results" id="search-results" role="listbox" aria-label="Search results" hidden></ul>
  </div>
  <button type="button" class="btn icon-btn mode-toggle" id="mode-toggle" aria-label="Switch colour mode">
    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <a class="btn icon-btn repo-link" href="https://github.com/Franklindot04/production-platform-Azure" aria-label="Repository">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="6" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="19" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="9" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 7.2v9.6M18 11.2c0 4-5 4-11 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </a>
</header>
